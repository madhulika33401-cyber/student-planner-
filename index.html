<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">STUDY SMART • STAY ORGANIZED</p>
      <h1>My Student Planner <span>✏️</span></h1>
      <p class="subtitle">A little progress every day adds up.</p>
    </div>
    <div class="today" id="today"></div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Study summary">
      <article class="stat-card"><span>All tasks</span><strong id="totalCount">0</strong></article>
      <article class="stat-card"><span>Completed</span><strong id="completedCount">0</strong></article>
      <article class="stat-card"><span>Pending</span><strong id="pendingCount">0</strong></article>
    </section>

    <section class="panel">
      <h2>Add a study task</h2>
      <form id="taskForm">
        <label for="taskTitle">Task name</label>
        <input id="taskTitle" type="text" placeholder="e.g. Read Chapter 3" required maxlength="90">
        <div class="form-row">
          <div>
            <label for="subject">Subject</label>
            <select id="subject">
              <option>Mathematics</option><option>Science</option><option>English</option>
              <option>Social Studies</option><option>Computer</option><option>Other</option>
            </select>
          </div>
          <div>
            <label for="dueDate">Due date</label>
            <input id="dueDate" type="date" required>
          </div>
        </div>
        <button type="submit">＋ Add task</button>
      </form>
    </section>

    <section class="panel task-panel">
      <div class="task-heading">
        <div><h2>My tasks</h2><p class="muted">Check off each task when you finish it.</p></div>
        <select id="filter" aria-label="Filter tasks">
          <option value="all">All tasks</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <ul id="taskList" class="task-list"></ul>
      <p id="emptyMessage" class="empty">No tasks here yet. Add your first study task above!</p>
    </section>
  </main>
  <footer>Made for focused minds 💜</footer>
  <script src="script.js"></script>
</body>
</html>
